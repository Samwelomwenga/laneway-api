title = "Laneway API gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Files and values that are safe to commit"
paths = [
  '''(^|/)appsettings\.Development\.json$''',
  '''(^|/)Migrations/''',
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)scripts/check-secrets\.sh$''',
]
regexes = [
  # UserSecretsId from the csproj files. It names a local folder and holds no secret.
  '''0e838897-61eb-4e95-aa86-b5dad1c4e8e2''',
  # JWT signing keys the test host and BearerTokenTests use. No real issuer trusts them.
  '''cNDergQ\+t0OsqAmWjqRYls/RSPk11lB9DEUWpkpREDU=''',
  '''sPrCzru4irSfWucz67ISqUecyHq28c\+ty6TQ0jhRkdQ=''',
]
