name: Terraform vm

on:
  push:
    branches: [main]
    paths:
      - terraform/vm/**
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      drift:
        description: Run the drift check instead of plan and apply
        type: boolean
        default: false

permissions: {}

concurrency:
  group: terraform-vm${{ (github.event_name == 'schedule' || inputs.drift == true) && '-drift' || '' }}
  cancel-in-progress: false

jobs:
  terraform:
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/terraform.yml
    with:
      root: vm
      drift: ${{ github.event_name == 'schedule' || inputs.drift == true }}
      id-token-audience: https://cloud.oracle.com
    secrets: inherit # zizmor: ignore[secrets-inherit] passing secrets by name leaves the called jobs' environment secrets empty, actions/runner#4453
