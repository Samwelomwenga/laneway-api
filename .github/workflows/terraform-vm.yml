name: Terraform vm

on:
  push:
    branches: [main]
    paths:
      - terraform/vm/**
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      drift:
        description: Run the drift check instead of plan and apply
        type: boolean
        default: false

permissions: {}

concurrency:
  group: terraform-vm${{ (github.event_name == 'schedule' || inputs.drift == true) && '-drift' || '' }}
  cancel-in-progress: false

jobs:
  alloy:
    name: Alloy check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ALLOY_IMAGE: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format check
        run: docker run --rm --volume "$PWD/terraform/vm:/config:ro" "$ALLOY_IMAGE" fmt --test /config/config.alloy
      - name: Validate
        run: docker run --rm --volume "$PWD/terraform/vm:/config:ro" "$ALLOY_IMAGE" validate /config/config.alloy

  terraform:
    needs: alloy
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/terraform.yml
    with:
      root: vm
      drift: ${{ github.event_name == 'schedule' || inputs.drift == true }}
      id-token-audience: https://cloud.oracle.com
    secrets: inherit # zizmor: ignore[secrets-inherit] passing secrets by name leaves the called jobs' environment secrets empty, actions/runner#4453
