name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Start storage
        run: supabase start -x realtime,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Restore
        run: dotnet restore Laneway.Api.sln
      - name: Build
        run: dotnet build Laneway.Api.sln --no-restore -c Release
      - name: Test
        env:
          DOTNET_USE_POLLING_FILE_WATCHER: 1
        run: |
          eval "$(supabase status -o env)"
          export Supabase__Url="$API_URL"
          export Supabase__ServiceRoleKey="$SERVICE_ROLE_KEY"
          dotnet test Laneway.Api.sln --no-build -c Release
