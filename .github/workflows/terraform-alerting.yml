name: Terraform alerting

on:
  push:
    branches: [main]
    paths:
      - terraform/alerting/**
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      drift:
        description: Run the drift check instead of plan and apply
        type: boolean
        default: false

permissions: {}

concurrency:
  group: terraform-alerting
  cancel-in-progress: false

jobs:
  terraform:
    permissions:
      contents: read
    uses: $/.github/workflows/terraform.yml
    with:
      root: alerting
      drift: ${{ github.event_name == 'schedule' || inputs.drift == true }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
