name: Terraform alerting

on:
  push:
    branches: [main, ci/terraform-alerting-gate]
    paths:
      - terraform/alerting/**
      - .github/workflows/terraform*.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      drift:
        description: Run the drift check instead of plan and apply
        type: boolean
        default: false

permissions: {}

concurrency:
  group: terraform-alerting${{ (github.event_name == 'schedule' || inputs.drift == true) && '-drift' || '' }}
  cancel-in-progress: false

jobs:
  terraform:
    permissions:
      contents: read
    uses: $/.github/workflows/terraform.yml
    with:
      root: alerting
      drift: ${{ github.event_name == 'schedule' || inputs.drift == true }}
    secrets: inherit # zizmor: ignore[secrets-inherit] passing secrets by name leaves the called jobs' environment secrets empty, actions/runner#4453
