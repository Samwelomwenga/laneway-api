name: Image

on:
  workflow_call:
    inputs:
      platform:
        description: The one platform to build, on a native runner
        required: false
        type: string
        default: linux/amd64
      push:
        description: Push the image to GHCR after the scan passes
        required: false
        type: boolean
        default: false
      attest:
        description: Attest provenance and an SBOM for the pushed digest
        required: false
        type: boolean
        default: false
      version:
        description: The version the image reports as service.version
        required: false
        type: string
        default: 0.0.0-pr
    outputs:
      digest:
        description: The image digest
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build and scan
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      digest: ${{ steps.push.outputs.digest || steps.build.outputs.digest }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      TRIVY_QUIET: true
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ inputs.platform }}
          build-args: VERSION=${{ inputs.version }}
          tags: laneway-api:scan
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: ${{ !inputs.push && format('type=gha,scope={0}', inputs.platform) || '' }}
          cache-to: ${{ !inputs.push && format('type=gha,mode=max,scope={0}', inputs.platform) || '' }}
      - name: Report findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laneway-api:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Gate on fixable findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laneway-api:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-gate.sarif
          limit-severities-for-sarif: true
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push
        id: push
        if: inputs.push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "$VERSION" "sha-${GITHUB_SHA::7}"; do
            docker tag laneway-api:scan "$image:$tag"
            docker push --quiet "$image:$tag"
          done
          digest=$(docker buildx imagetools inspect "$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: SBOM
        if: inputs.push && inputs.attest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laneway-api:scan
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true
      - name: Attest provenance
        if: inputs.push && inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
      - name: Attest SBOM
        if: inputs.push && inputs.attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
      - name: Digest
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.build.outputs.digest }}
        run: echo "Image digest $DIGEST"
