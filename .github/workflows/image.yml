name: Image

on:
  workflow_call:
    inputs:
      platform:
        description: The one platform to build, on a native runner
        required: false
        type: string
        default: linux/amd64
      push:
        description: Push the image to GHCR after the scan passes
        required: false
        type: boolean
        default: false
      attest:
        description: Attest provenance and an SBOM for the pushed digest
        required: false
        type: boolean
        default: false
      version:
        description: The version the image reports as service.version
        required: false
        type: string
        default: 0.0.0-pr
    outputs:
      digest:
        description: The image digest
        value: ${{ jobs.build.outputs.digest }}

permissions: {}

jobs:
  build:
    name: Build and scan
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      TRIVY_QUIET: true
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ inputs.platform }}
          build-args: VERSION=${{ inputs.version }}
          tags: laneway-api:scan
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ inputs.platform }}
      - name: Report findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laneway-api:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
      - name: Gate on fixable findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: laneway-api:scan
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-gate.sarif
          limit-severities-for-sarif: true
          skip-setup-trivy: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image digest $DIGEST"
